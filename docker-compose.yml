version: '3.8'

configs:
  primary_ddl:
    file: ./ddl.sql
  primary_init:
    file: ./scripts/init-primary.sql
  primary_conf:
    file: ./scripts/postgresql-primary.conf
  primary_hba:
    file: ./scripts/pg_hba.conf
  standby_conf:
    file: ./scripts/postgresql-standby.conf
  reports_init:
    file: ./scripts/init-reports.sql
  etl_script:
    file: ./scripts/etl-oltp-to-olap.sql

services:
  # Primary Database (OLTP)
  postgres-primary:
    image: postgres:16-alpine
    container_name: olap_oltp_primary
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: movies_oltp
      POSTGRES_INITDB_ARGS: "-c wal_level=replica -c max_wal_senders=3 -c max_replication_slots=3"
    
    volumes:
      - primary_data:/var/lib/postgresql/data
      - wal_archive_data:/var/lib/postgresql/wal_archive
    
    configs:
      - source: primary_ddl
        target: /docker-entrypoint-initdb.d/01-schema.sql
      - source: primary_init
        target: /docker-entrypoint-initdb.d/02-replication.sql
      - source: primary_conf
        target: /etc/postgresql/postgresql.conf
      - source: primary_hba
        target: /etc/postgresql/pg_hba.conf

    ports:
      - "5432:5432"
    networks:
      - olap_oltp_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: postgres -c config_file=/etc/postgresql/postgresql.conf -c hba_file=/etc/postgresql/pg_hba.conf

  # Hot Backup Database (Streaming Replication)
  postgres-backup:
    image: postgres:16-alpine
    container_name: olap_oltp_backup
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      PGDATA: /var/lib/postgresql/data/pgdata
    
    volumes:
      - backup_data:/var/lib/postgresql/data
    
    configs:
      - source: standby_conf
        target: /etc/postgresql/postgresql.conf

    ports:
      - "5433:5432"
    networks:
      - olap_oltp_network
    
    depends_on:
      - postgres-primary
      
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres || exit 0"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: >
      bash -c "
      if [ ! -s /var/lib/postgresql/data/pgdata/PG_VERSION ]; then
        echo 'Setting up standby server...'
        rm -rf /var/lib/postgresql/data/pgdata/*
        until PGPASSWORD=replicator pg_basebackup -h postgres-primary -U replicator -D /var/lib/postgresql/data/pgdata -Fp -Xs -P -R; do
          sleep 5
        done
        chown -R postgres:postgres /var/lib/postgresql/data/pgdata
      fi
      
      exec docker-entrypoint.sh postgres -c config_file=/etc/postgresql/postgresql.conf
      "

  # Reports Database (OLAP)
  postgres-reports:
    image: postgres:16-alpine
    container_name: olap_oltp_reports
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: movies_olap
      
    volumes:
      - reports_data:/var/lib/postgresql/data
      
    configs:
      - source: reports_init
        target: /docker-entrypoint-initdb.d/01-init-reports.sql
        
    ports:
      - "5434:5432"
    networks:
      - olap_oltp_network
    
    depends_on:
      - postgres-primary
      
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API
  backend:
    image: gabarc0/olap-oltp-backend:latest
    container_name: olap_oltp_backend
    environment:
      NODE_ENV: production
      DB_USER: postgres
      DB_PASSWORD: password
      DB_HOST: postgres-primary
      DB_PORT: 5432
      DB_NAME: movies_oltp
      DB_HOST_REPORTS: postgres-reports
      DB_PORT_REPORTS: 5432
      DB_NAME_REPORTS: movies_olap
      PORT: 3000
    ports:
      - "3000:3000"
    networks:
      - olap_oltp_network
      
    depends_on:
      - postgres-primary
      - postgres-reports
      
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Frontend
  frontend:
    image: gabarc0/olap-oltp-frontend:latest
    container_name: olap_oltp_frontend
    ports:
      - "80:80"
    networks:
      - olap_oltp_network
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:80"]
      interval: 30s
      timeout: 10s
      retries: 3

  # PgAdmin
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: olap_oltp_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5050:80"
    networks:
      - olap_oltp_network
    depends_on:
      - postgres-primary
    volumes:
      - pgadmin_data:/var/lib/pgadmin

  # ETL Service - Fixed to use configs instead of bind mount
  etl:
    image: postgres:16-alpine
    depends_on:
      - postgres-primary
      - postgres-reports
    networks:
      - olap_oltp_network
    configs:
      - source: etl_script
        target: /scripts/etl-oltp-to-olap.sql
    command: >
      sh -c "while true; do
        echo 'Running ETL process...';
        psql 'host=postgres-reports user=postgres password=password dbname=movies_olap' < /scripts/etl-oltp-to-olap.sql;
        echo 'ETL completed. Sleeping for 300 seconds...';
        sleep 300;
      done"

volumes:
  primary_data:
  backup_data:
  reports_data:
  pgadmin_data:
  wal_archive_data: 

networks:
  olap_oltp_network:
    driver: overlay