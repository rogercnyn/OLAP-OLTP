# PostgreSQL 16 Configuration - Standby Server (Hot Backup)
# Must match or exceed primary settings

# ========================================
# CONNECTION SETTINGS
# ========================================
listen_addresses = '*'
port = 5432
max_connections = 100

# ========================================
# WRITE-AHEAD LOG (WAL) SETTINGS
# ========================================
wal_level = replica
fsync = on
synchronous_commit = on
wal_sync_method = fdatasync

# Replication Settings (must match or exceed primary)
max_wal_senders = 5                    # Must be >= primary
max_replication_slots = 5
wal_keep_size = 256MB

# Standby Settings
hot_standby = on                       # Allow read-only queries
wal_receiver_timeout = 60s
max_standby_streaming_delay = 30s
max_standby_archive_delay = 30s

# ========================================
# MEMORY SETTINGS
# ========================================
shared_buffers = 256MB
effective_cache_size = 1GB
work_mem = 4MB
maintenance_work_mem = 64MB

# ========================================
# QUERY TUNING
# ========================================
random_page_cost = 1.1
effective_io_concurrency = 200
default_statistics_target = 100

# ========================================
# LOGGING
# ========================================
logging_collector = on
log_destination = 'stderr'
log_directory = 'log'
log_filename = 'postgresql-%Y-%m-%d.log'
log_rotation_age = 1d
log_rotation_size = 100MB
log_line_prefix = '[STANDBY] %t [%p]: '
log_timezone = 'UTC'
log_min_duration_statement = 1000
log_connections = on
log_disconnections = on
log_replication_commands = on

# ========================================
# LOCALE & TIMEZONE
# ========================================
datestyle = 'iso, mdy'
timezone = 'UTC'
lc_messages = 'en_US.utf8'
lc_monetary = 'en_US.utf8'
lc_numeric = 'en_US.utf8'
lc_time = 'en_US.utf8'
default_text_search_config = 'pg_catalog.english'
